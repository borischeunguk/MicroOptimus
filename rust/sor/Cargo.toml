[package]
name = "sor"
version.workspace = true
edition.workspace = true

[dependencies]
common = { path = "../common" }

[features]
aeron-integration = ["common/aeron"]
chronicle-integration = ["common/chronicle"]

[dev-dependencies]
algo = { path = "../algo" }
marketdata = { path = "../marketdata" }
criterion = "0.5"
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "router_latency"
harness = false
required-features = ["aeron-integration"]

[[bench]]
name = "e2e_algo_sor_latency"
harness = false
required-features = ["aeron-integration"]

[[bench]]
name = "e2e_algo_sor_marketdata_latency"
harness = false
required-features = ["aeron-integration"]

[[bench]]
name = "e2e_algo_sor_chronicle_marketdata_latency"
harness = false
required-features = ["chronicle-integration"]

[[bin]]
name = "sor_aeron_service"
required-features = ["aeron-integration"]

[[bin]]
name = "sor_marketdata_aeron_service"
required-features = ["aeron-integration"]

[[bin]]
name = "sor_marketdata_chronicle_service"
required-features = ["chronicle-integration"]

